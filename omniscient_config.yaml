# omniscient_config.yaml
# Configuration for the Omniscient Architect content-review tools.
# Loaded by tools/validate_content.py and tools/run_review.py via
#   omniscient_core.load_config(config_path=Path("omniscient_config.yaml"))
#
# Priority (highest → lowest):
#   1. Environment variables (OLLAMA_MODEL, OMNISCIENT_API_KEY, …)
#   2. Values in this file
#   3. AnalysisConfig defaults (omniscient_core.models.AnalysisConfig)

# ── File scanning ──────────────────────────────────────────────────────────
include_patterns:
  - "*.md"
  - "*.yml"
  - "*.yaml"

exclude_patterns:
  - ".git"
  - "__pycache__"
  - "node_modules"
  - "vendor"
  - "_site"
  - ".omniscient_cache"

# Limit per-file content sent to the LLM (bytes)
max_content_bytes_per_file: 30720   # 30 KB — modules can be large

# ── LLM provider (Improvement 2 — LLM agents) ─────────────────────────────
# Default: Ollama running locally (privacy-first, no API cost).
# Override via OLLAMA_MODEL / OLLAMA_HOST environment variables,
# or set OPENAI_API_KEY / ANTHROPIC_API_KEY for cloud providers.
ollama_model: "codellama:7b-instruct"
ollama_host: "http://localhost:11434"
analysis_depth: "standard"          # "quick" | "standard" | "deep"

# ── Caching ───────────────────────────────────────────────────────────────
cache_enabled: true
cache_dir: ".omniscient_cache"
cache_ttl: 3600                     # seconds

# ── API server (not used by this repo — kept for completeness) ─────────────
api_port: 8000
